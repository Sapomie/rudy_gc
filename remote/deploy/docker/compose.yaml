services:
  remote-solver:
    container_name: rudy_gc_remote_solver
    image: ${REMOTE_SOLVER_IMAGE:?REMOTE_SOLVER_IMAGE is required}
    pull_policy: never
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: Asia/Shanghai
      HOST: 172.30.0.1
      PORT: 8191
      LOG_LEVEL: info
      LOG_HTML: "false"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  remote-api:
    container_name: rudy_gc_remote_api
    image: ${REMOTE_API_IMAGE:?REMOTE_API_IMAGE is required}
    pull_policy: never
    restart: unless-stopped
    command: ["-f", "/app/config/server.yaml"]
    environment:
      TZ: Asia/Shanghai
    ports:
      - "5031:5031"
    volumes:
      - ${REMOTE_CONFIG_FILE:?REMOTE_CONFIG_FILE is required}:/app/config/server.yaml:ro
    networks:
      - remote-internal
      - mysql-infra
    depends_on:
      - remote-solver
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  remote-web:
    container_name: rudy_gc_remote_web
    image: ${REMOTE_WEB_IMAGE:?REMOTE_WEB_IMAGE is required}
    pull_policy: never
    restart: unless-stopped
    ports:
      - "5032:5032"
    volumes:
      - ${REMOTE_NGINX_CONFIG_FILE:?REMOTE_NGINX_CONFIG_FILE is required}:/etc/nginx/conf.d/default.conf:ro
    networks:
      - remote-internal
    depends_on:
      - remote-api
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  remote-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
          gateway: 172.30.0.1
  mysql-infra:
    external: true
    name: rudy_shared_infra
