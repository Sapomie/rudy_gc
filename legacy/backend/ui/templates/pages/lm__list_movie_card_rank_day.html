{{ define "page.list_movie_card_rank_day" }}
    <!doctype html>
    <html lang="en">
    <head>
        <meta charset="utf-8">
        <title>{{ if .Title }}{{ .Title }} - {{ end }}Rudy-GC</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="/static/css/bootstrap.min.css" rel="stylesheet">
        <link href="/static/css/icons.min.css" rel="stylesheet">
        <link href="/static/css/app.min.css" rel="stylesheet">
        <link href="/static/css/dataTables.bootstrap4.min.css" rel="stylesheet">
        <link href="/static/css/buttons.bootstrap4.min.css" rel="stylesheet">
        <link href="/static/css/responsive.bootstrap4.min.css" rel="stylesheet">
        <link href="/static/css/custom/a_moviecardlist.css" rel="stylesheet">
    </head>

    <body data-sidebar="dark">
    {{ template "menu" . }}

    <main class="main-content">
        <div class="page-content">
            <div class="container-fluid">
                <div class="d-flex flex-column flex-md-row align-items-start align-items-md-center justify-content-between gap-2 mb-3">
                    <div class="alert alert-success py-2 mb-0">
                        <div class="d-flex flex-column gap-2">
                            <div class="d-flex align-items-center gap-2">
                                <strong class="font-size-14">Rank Date</strong>
                                <span class="font-18 fw-semibold">{{ .rankDate }}</span>
                            </div>
                            <div class="d-flex align-items-center gap-2">
                                <strong class="font-size-14">Total</strong>
                                <span class="font-18 fw-semibold">{{ .total }}</span>
                            </div>
                        </div>
                    </div>
                    <div class="d-flex flex-column flex-md-row gap-2 align-items-start align-items-md-center">
                        <div class="btn-group btn-group-sm" role="group" aria-label="Rank day navigation">
                            <a href="/moviecarddayrank?date={{ .prevDate }}"
                               class="btn btn-outline-primary {{ if .prevDisabled }}disabled{{ end }}"
                               aria-disabled="{{ if .prevDisabled }}true{{ else }}false{{ end }}">前一天</a>
                            <a href="/moviecarddayrank?date={{ .nextDate }}"
                               class="btn btn-outline-primary {{ if .nextDisabled }}disabled{{ end }}"
                               aria-disabled="{{ if .nextDisabled }}true{{ else }}false{{ end }}">后一天</a>
                            <a href="/moviecarddayrank?date={{ .randDate }}"
                               class="btn btn-outline-primary">随机</a>
                        </div>
                        <form class="d-flex gap-2" method="get" action="/moviecarddayrank">
                            <input type="text" class="form-control form-control-sm" name="date" value="{{ .rankDate }}"
                                   placeholder="YYYY-MM-DD" maxlength="10" pattern="[0-9]{4}-[0-9]{2}-[0-9]{2}"
                                   inputmode="numeric" />
                            <button class="btn btn-sm btn-outline-primary" type="submit">Go</button>
                        </form>
                    </div>
                </div>

                <div class="d-flex justify-content-end mb-3">
                    {{ template "pagination" . }}
                </div>

                <section aria-label="Movies">
                    <div class="row row-cols-2 row-cols-sm-3 row-cols-lg-5 row-cols-xxl-6 g-3" id="movie-grid">
                        {{ range .movies }}
                            {{ template "card" . }}
                        {{ end }}
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script src="/static/js/jquery.min.js"></script>
    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/metisMenu.min.js"></script>
    <script src="/static/js/simplebar.min.js"></script>
    <script src="/static/js/waves.min.js"></script>
    <script src="/static/js/jquery.sparkline.min.js"></script>
    <script src="/static/js/dataTables.buttons.min.js"></script>
    <script src="/static/js/buttons.bootstrap4.min.js"></script>
    <script src="/static/js/jszip.min.js"></script>
    <script src="/static/js/buttons.html5.min.js"></script>
    <script src="/static/js/buttons.print.min.js"></script>
    <script src="/static/js/buttons.colVis.min.js"></script>
    <script src="/static/js/dashboard.init.js"></script>
    <script src="/static/js/app.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            var list = [].slice.call(document.querySelectorAll('[title]'));
            list.forEach(function (el) {
                if (el.getAttribute('data-bs-toggle') !== 'tooltip') {
                    el.setAttribute('data-bs-toggle', 'tooltip');
                    if (window.bootstrap && bootstrap.Tooltip) {
                        new bootstrap.Tooltip(el, {boundary: document.body, container: 'body'});
                    }
                }
            });
        });
    </script>
    </body>
    </html>
{{ end }}
