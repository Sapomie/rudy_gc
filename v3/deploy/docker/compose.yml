services:
  gc-api:
    build:
      context: ../..
      dockerfile: deploy/docker/api.Dockerfile
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        HTTP_PROXY: http://host.docker.internal:7897/
        HTTPS_PROXY: http://host.docker.internal:7897/
        ALL_PROXY: http://host.docker.internal:7897/
        http_proxy: http://host.docker.internal:7897/
        https_proxy: http://host.docker.internal:7897/
        all_proxy: http://host.docker.internal:7897/
    image: rudy_gc_v3_api:local
    container_name: rudy_gc_v3_api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GIN_MODE: release
      TZ: Asia/Shanghai
    ports:
      - "15013:15013"
    volumes:
      - ./config/api.config.yaml:/app/config/api.config.yaml:ro
      - /Volumes/Expansion:/Volumes/Expansion
      - /Volumes/T7/data:/Volumes/T7/data
      - /Users/gaojinwei/Desktop/temp/sc:/Users/gaojinwei/Desktop/temp/sc
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:15013/api/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  gc-web:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        HTTP_PROXY: http://host.docker.internal:7897/
        HTTPS_PROXY: http://host.docker.internal:7897/
        ALL_PROXY: http://host.docker.internal:7897/
        http_proxy: http://host.docker.internal:7897/
        https_proxy: http://host.docker.internal:7897/
        all_proxy: http://host.docker.internal:7897/
    image: rudy_gc_v3_web:local
    container_name: rudy_gc_v3_web
    depends_on:
      gc-api:
        condition: service_healthy
    environment:
      PORT: "15012"
      TZ: Asia/Shanghai
      V3_API_ORIGIN: http://gc-api:15013
    ports:
      - "15012:15012"
    volumes:
      - /Volumes/Expansion:/Volumes/Expansion
      - /Volumes/T7/data:/Volumes/T7/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:15012/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
