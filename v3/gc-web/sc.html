<head>
    <meta charset="utf-8">
    <title>SC - Rudy-GC</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/icons.min.css" rel="stylesheet">
    <link href="/static/css/app.min.css" rel="stylesheet">
    <link href="/static/css/custom/a_moviecardlist.css" rel="stylesheet">
    <link href="/static/css/custom/sc_event.css" rel="stylesheet">
    <link href="/static/customer/media_ingest.css" rel="stylesheet">
    <link href="/static/customer/media_rescan.css" rel="stylesheet">
    <link href="/static/customer/media_rollback.css" rel="stylesheet">
    <style>
        .section-card {
            background: #fff;
            border-radius: .5rem;
            box-shadow: 0 2px 6px rgba(0, 0, 0, .06);
            margin-bottom: 1rem;
        }
        .sort-link {
            color: inherit;
            font-weight: 600;
            text-decoration: none;
        }
        .sort-link.active {
            color: #0d6efd;
        }
        .sc-result-json {
            max-height: 24rem;
            overflow: auto;
            white-space: pre-wrap;
        }
        #msgArea {
            bottom: 1rem;
            display: none;
            position: fixed;
            right: 1rem;
            z-index: 2000;
        }
        .sc-preview-movie-grid {
            display: grid;
            grid-template-columns: repeat(8, minmax(0, 1fr));
            gap: 12px;
        }
        .sc-preview-movie-card {
            border: 1px solid #e9ecef;
            border-radius: 6px;
            padding: 10px;
            min-height: 188px;
        }
        .sc-preview-movie-poster {
            width: 100%;
            aspect-ratio: 2 / 3;
            border-radius: 6px;
            object-fit: cover;
            object-position: right center;
            background: #f8f9fa;
            display: block;
        }
        .sc-preview-movie-poster-empty {
            width: 100%;
            aspect-ratio: 2 / 3;
            border-radius: 6px;
            background: #f8f9fa;
            border: 1px dashed #dee2e6;
        }
        .sc-preview-movie-link {
            display: block;
            margin-top: 8px;
            margin-bottom: 8px;
            color: #212529;
            font-size: 12px;
            line-height: 1.35;
            text-decoration: none;
            word-break: break-word;
        }
        .sc-preview-movie-link:hover {
            color: #0d6efd;
        }
        .sc-preview-is-sc-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .sc-preview-is-sc-btn {
            min-width: 54px;
            height: 28px;
            border-radius: 6px;
            padding: 0 6px;
            font-size: 12px;
            line-height: 26px;
        }
        .sc-preview-is-sc-input-1:checked + .sc-preview-is-sc-btn-1 {
            background: #6c757d;
            border-color: #6c757d;
            color: #fff;
        }
        .sc-preview-is-sc-input-2:checked + .sc-preview-is-sc-btn-2 {
            background: #f1c40f;
            border-color: #f1c40f;
            color: #212529;
        }
        @media (max-width: 1399.98px) {
            .sc-preview-movie-grid {
                grid-template-columns: repeat(6, minmax(0, 1fr));
            }
        }
        @media (max-width: 1199.98px) {
            .sc-preview-movie-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }
        @media (max-width: 767.98px) {
            .sc-preview-movie-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
    </style>
</head>
