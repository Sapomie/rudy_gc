<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>MovieCard - Rudy-GC</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/icons.min.css" rel="stylesheet">
    <link href="/static/css/app.min.css" rel="stylesheet">
    <link href="/static/css/custom/a_moviecardlist.css" rel="stylesheet">
</head>

<body data-sidebar="dark">
<!-- ========== Header ========== -->
<header id="page-topbar">
    <div class="navbar-header">
        <div class="d-flex">
            <div class="navbar-brand-box">
                <a href="/" class="logo logo-light"></a>
            </div>

            <button type="button" class="btn btn-sm px-3 font-size-24 header-item waves-effect vertical-menu-btn">
                <i class="mdi mdi-menu"></i>
            </button>
        </div>

        <div class="d-flex align-items-center">
            <div class="d-none d-md-flex align-items-center me-2" id="top-nav-root"></div>

            <div class="dropdown d-none d-lg-inline-block">
                <button type="button" class="btn header-item noti-icon waves-effect" data-toggle="fullscreen">
                    <i class="mdi mdi-fullscreen font-size-24"></i>
                </button>
            </div>

            <div class="dropdown d-inline-block">
                <button type="button" class="btn header-item waves-effect" id="page-header-user-dropdown"
                        data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                </button>

                <div class="dropdown-menu dropdown-menu-end">
                    <a class="dropdown-item" href="/login">
                        <i class="mdi mdi-lock-open-outline font-size-17 text-muted align-middle me-1"></i> Login
                    </a>
                    <div class="dropdown-divider"></div>
                    <a class="dropdown-item text-danger" href="/logout">
                        <i class="mdi mdi-power font-size-17 text-muted align-middle me-1 text-danger"></i> Logout
                    </a>
                </div>
            </div>
        </div>
    </div>
</header>

<!-- ========== Left Sidebar Start ========== -->
<div id="sidebar-root"></div>
<script src="/src/sidebar.js"></script>
<script type="module" src="/src/top-nav.js"></script>

<main class="main-content">
    <div class="page-content">
        <div class="container-fluid">
            <div class="position-sticky pb-2 pt-2 mb-3 border-bottom"
                 style="top:0; z-index:1030; background:rgba(255,255,255,.9); backdrop-filter: blur(6px);">
                <div class="container-fluid px-0">
                    <div class="d-flex flex-wrap justify-content-start align-items-center mb-2" id="sort-bar"></div>
                    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2">
                        <div class="d-flex flex-wrap align-items-center gap-2" id="owned-filter"></div>
                        <div class="d-flex align-items-center ms-md-3" id="pagination-top"></div>
                    </div>
                </div>
            </div>

            <div id="movie-card-filter"></div>

            <section aria-label="Movies">
                <div class="row row-cols-2 row-cols-sm-3 row-cols-lg-5 row-cols-xxl-6 g-3" id="movie-grid"></div>
            </section>
            <div id="movie-card-page-date-editor"></div>
        </div>
    </div>
</main>

<script src="/static/js/jquery.min.js"></script>
<script src="/static/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/metisMenu.min.js"></script>
<script src="/static/js/simplebar.min.js"></script>
<script src="/static/js/waves.min.js"></script>
<script src="/static/js/jquery.sparkline.min.js"></script>
<script src="/static/js/app.js"></script>
<script type="module" src="/src/cards.js"></script>
</body>
</html>
