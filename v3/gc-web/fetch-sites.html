<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>FetchSites - Rudy-GC</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/icons.min.css" rel="stylesheet">
    <link href="/static/css/app.min.css" rel="stylesheet">
    <style>
        .fetch-sites-table th,
        .fetch-sites-table td {
            vertical-align: middle;
            white-space: nowrap;
        }
        .fetch-sites-table .wide {
            min-width: 18rem;
            white-space: normal;
            word-break: break-word;
        }
        .fetch-sites-table .mono {
            font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: .875rem;
        }
        #fetchSiteMsg {
            bottom: 1rem;
            display: none;
            position: fixed;
            right: 1rem;
            z-index: 2000;
        }
    </style>
</head>

<body data-sidebar="dark">
<header id="page-topbar">
    <div class="navbar-header">
        <div class="d-flex">
            <div class="navbar-brand-box">
                <a href="/" class="logo logo-light"></a>
            </div>
            <button type="button" class="btn btn-sm px-3 font-size-24 header-item waves-effect vertical-menu-btn">
                <i class="mdi mdi-menu"></i>
            </button>
        </div>
        <div class="d-flex align-items-center">
            <div class="d-none d-md-flex align-items-center me-2" id="top-nav-root"></div>
        </div>
    </div>
</header>

<div id="sidebar-root"></div>
<script src="/src/sidebar.js"></script>
<script type="module" src="/src/top-nav.js"></script>

<main class="main-content">
    <div class="page-content">
        <div class="container-fluid" id="fetch-sites-root"></div>
    </div>
</main>

<div id="fetchSiteMsg" class="alert alert-success fade show small py-2 px-3"></div>

<script src="/static/js/jquery.min.js"></script>
<script src="/static/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/metisMenu.min.js"></script>
<script src="/static/js/simplebar.min.js"></script>
<script src="/static/js/waves.min.js"></script>
<script src="/static/js/jquery.sparkline.min.js"></script>
<script src="/static/js/app.js"></script>
<script type="module" src="/src/fetch-sites.js"></script>
</body>
</html>
