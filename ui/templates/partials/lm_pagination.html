{{ define "pagination" }}
    <nav aria-label="Page navigation">
        <ul class="pagination">
            {{ range .PageInfo.Links }}
                {{ if .Ellipsis }}
                    <li class="page-item disabled"><span class="page-link">…</span></li>
                {{ else }}
                    <li class="page-item {{ if .Active }}active{{ end }} {{ if .Disabled }}disabled{{ end }}">
                        <a class="page-link" href="{{ .Href }}" {{ if .Disabled }}tabindex="-1"
                           aria-disabled="true"{{ end }}>
                            {{ .Label }}
                        </a>
                    </li>
                {{ end }}
            {{ end }}
        </ul>
    </nav>
{{ end }}

{{ define "owned_filter" }}
    <span class="card-title d-inline-flex gap-2 align-items-center">

  <a href="{{ .ownedQuery.All.Href }}"
     class="btn btn-primary waves-effect waves-light {{ if .ownedQuery.All.Active }}active disabled{{ end }}"
     aria-current="{{ if .ownedQuery.All.Active }}true{{ else }}false{{ end }}">
     AllMovie
  </a>

  <a href="{{ .ownedQuery.Owned.Href }}"
     class="btn btn-danger waves-effect waves-light {{ if .ownedQuery.Owned.Active }}active disabled{{ end }}"
     aria-current="{{ if .ownedQuery.Owned.Active }}true{{ else }}false{{ end }}">
     Owned
  </a>

  <span class="btn btn-primary waves-effect waves-light">Total: {{ .total }}</span>
</span>
{{ end }}
