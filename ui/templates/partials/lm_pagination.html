{{ define "pagination" }}
    <nav class="mb-0" aria-label="Page navigation">
        <ul class="pagination pagination-sm mb-0">
            {{ range .PageInfo.Links }}
                {{ if .Ellipsis }}
                    <li class="page-item disabled"><span class="page-link">…</span></li>
                {{ else }}
                    <li class="page-item {{ if .Active }}active{{ end }} {{ if .Disabled }}disabled{{ end }}">
                        <a class="page-link" href="{{ .Href }}" {{ if .Disabled }}tabindex="-1"
                           aria-disabled="true"{{ end }}>
                            {{ .Label }}
                        </a>
                    </li>
                {{ end }}
            {{ end }}
        </ul>
    </nav>
{{ end }}

{{ define "owned_filter" }}
    <div class="d-flex flex-wrap align-items-center gap-2">
        <a href="{{ .ownedQuery.All.Href }}"
           class="btn btn-sm btn-primary waves-effect waves-light {{ if .ownedQuery.All.Active }}active disabled{{ end }}"
           aria-current="{{ if .ownedQuery.All.Active }}true{{ else }}false{{ end }}">
            AllMovie
        </a>

        <a href="{{ .ownedQuery.Owned.Href }}"
           class="btn btn-sm btn-danger waves-effect waves-light {{ if .ownedQuery.Owned.Active }}active disabled{{ end }}"
           aria-current="{{ if .ownedQuery.Owned.Active }}true{{ else }}false{{ end }}">
            Owned
        </a>

        <span class="btn btn-sm btn-primary waves-effect waves-light disabled">Total: {{ .total }}</span>
    </div>
{{ end }}
