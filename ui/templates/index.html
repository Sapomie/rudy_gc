{{define "index.html"}}
<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>电影列表</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2 class="mb-3">电影列表</h2>

    <p>总数：{{.Total}}，当前第 {{.Page}} 页（每页 {{.Size}} 条）</p>

    <table class="table table-striped table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>番号</th>
            <th>标题</th>
            <th>上映日</th>
            <th>片长</th>
            <th>评分</th>
        </tr>
        </thead>
        <tbody>
        {{range .Movies}}
        <tr>
            <td>{{.Id}}</td>
            <td>{{.JavId}}</td>
            <td>{{.Title}}</td>
            <td>{{.ReleasingDate}}</td>
            <td>{{.Length}}</td>
            <td>{{.Score}}</td>
        </tr>
        {{else}}
        <tr>
            <td colspan="6" class="text-center">暂无数据</td>
        </tr>
        {{end}}
        </tbody>
    </table>

    <div class="d-flex justify-content-between">
        <a class="btn btn-outline-primary btn-sm"
           href="/movies?page={{.PrevPage}}&size={{.Size}}"
           {{if not .HasPrev}}disabled{{end}}>上一页</a>

        <a class="btn btn-outline-primary btn-sm"
           href="/movies?page={{.NextPage}}&size={{.Size}}"
           {{if not .HasNext}}disabled{{end}}>下一页</a>
    </div>
</div>
</body>
</html>
{{end}}
