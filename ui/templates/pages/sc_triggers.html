{{ define "page.sc_triggers" }}
    <!doctype html>
    <html lang="zh-CN">
    <head>
        <meta charset="utf-8">
        <title>{{ if .Title }}{{ .Title }} - {{ end }}Rudy-GC</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="/static/css/bootstrap.min.css" rel="stylesheet">
        <link href="/static/css/icons.min.css" rel="stylesheet">
        <link href="/static/css/app.min.css" rel="stylesheet">
        <style>
            #msgArea {
                position: fixed;
                bottom: 20px;
                right: 20px;
                z-index: 2000;
                display: none;
            }
        </style>
    </head>

    <body data-sidebar="dark">
    {{ template "menu" . }}

    <main class="main-content">
        <div class="page-content">
            <div class="container-fluid">
	                <div class="d-flex align-items-center justify-content-between mb-3">
	                    <div>
	                        <h4 class="mb-1">SC Triggers</h4>
	                        <p class="text-muted mb-0">在这里执行 SC 事件导入预览、填写和确认提交。</p>
	                    </div>
	                    <div class="d-flex gap-2">
	                        <a href="/triggers" class="btn btn-outline-secondary">返回任务控制台</a>
	                        <a href="/crawler/tasks" class="btn btn-outline-primary">查看任务列表</a>
	                    </div>
	                </div>

                <div class="card">
                    <div class="card-body">
                        <h4 class="card-title">添加 SC 事件</h4>
                        <p class="card-title-desc">
                            扫描配置中的 SC 根目录，并要求其中仅有一个合法事件目录（例如：2026-03-17-20-00）。
                        </p>
                        <p class="text-muted small mb-3">
                            SC Root:
                            <code>{{ .ScRootDir }}</code>
                        </p>
                        <button id="btnScAddPreview" type="button" class="btn btn-outline-success">Add Preview</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="msgArea" class="alert alert-success fade show small py-2 px-3"></div>

    <div class="modal fade" id="addScPreviewModal" tabindex="-1" aria-labelledby="addScPreviewModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addScPreviewModalLabel">添加 SC 事件</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="formScAddConfirm">
                    <div class="modal-body">
                        <div id="scAddPreviewMsg" class="small mb-3"></div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label">事件名</label>
                                <input type="text" class="form-control" id="scPreviewName" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">图片</label>
                                <input type="text" class="form-control" id="scPreviewImage" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">影片数</label>
                                <input type="text" class="form-control" id="scPreviewMovieCount" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Come Movie</label>
                                <select class="form-select" id="scPreviewComeMovie" required></select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Movie Cast</label>
                                <select class="form-select" id="scPreviewMovieCast" required></select>
                            </div>
	                            <div class="col-md-6">
	                                <label class="form-label">Duration</label>
	                                <input type="number" class="form-control" id="scPreviewDuration" placeholder="分钟">
	                            </div>
                            <div class="col-md-6">
                                <label class="form-label">FG</label>
                                <input type="text" class="form-control" id="scPreviewFg" placeholder="可为空">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Vessel</label>
                                <input type="text" class="form-control" id="scPreviewVessel" placeholder="可为空">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Remarks</label>
                                <textarea class="form-control" id="scPreviewRemarks" rows="3" placeholder="可为空"></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">取消</button>
                        <button type="submit" class="btn btn-success">确认提交</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/static/customer/sc_triggers.js"></script>
    <script src="/static/js/jquery.min.js"></script>
    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/metisMenu.min.js"></script>
    <script src="/static/js/simplebar.min.js"></script>
    <script src="/static/js/waves.min.js"></script>
    <script src="/static/js/jquery.sparkline.min.js"></script>
    <script src="/static/js/app.js"></script>
    </body>
    </html>
{{ end }}
