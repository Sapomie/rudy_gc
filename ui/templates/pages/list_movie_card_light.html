{{ define "content" }}
    <div class="page-content">
        <div class="container-fluid">

            <!-- Sticky 工具栏：筛选 + 分页/随机 -->
            <div class="position-sticky pb-2 pt-2 mb-3 border-bottom"
                 style="top:0; z-index:1030; background:rgba(255,255,255,.9); backdrop-filter: blur(6px);">
                <div class="container-fluid px-0">
                    <!-- 一行：左 owned_filter ，右 pagination -->
                    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-2">
                        <div class="d-flex flex-wrap align-items-center toolbar-gap">
                            {{ template "owned_filter" . }}
                        </div>
                        <div class="d-flex flex-wrap align-items-center ms-md-3">
                            {{ template "pagination" . }}
                        </div>
                    </div>
                </div>
            </div>
            <!-- /Sticky 工具栏 -->

            <!-- movie card grid -->
            <section aria-label="Movies">
                <div class="row row-cols-2 row-cols-sm-3 row-cols-lg-5 row-cols-xxl-6 g-3" id="movie-grid">
                    {{ range .movies }}
                        {{ template "card" . }}
                    {{ end }}
                </div>
            </section>
            <!-- /movie card grid -->

        </div><!-- /.container-fluid -->
    </div><!-- /.page-content -->


{{ end }}
