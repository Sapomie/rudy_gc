{{ define "content" }}
    <div class="page-content">
        <div class="container-fluid">

            <!-- Sticky 工具栏：筛选 + 分页/随机 -->
            <div class="position-sticky pb-2 pt-2 mb-3 border-bottom"
                 style="top:0; z-index:1030; background:rgba(255,255,255,.9); backdrop-filter: blur(6px);">
                <div class="container-fluid px-0">
                    <div class="row align-items-center">

                        <div class="col-md-12 order-1 order-md-2 mb-2 mb-md-0">
                            <div class="d-flex flex-wrap justify-content-start align-items-center toolbar-gap">
                                {{ template "owned_filter" . }}
                            </div>
                        </div>

                        <div class="col-md-9 order-1 order-md-2 mb-2 mb-md-0">
                            <div class="d-flex flex-wrap justify-content-start align-items-center toolbar-gap">
                                {{ template "pagination" . }}
                            </div>
                        </div>

                    </div>
                </div>
            </div>
            <!-- /Sticky 工具栏 -->

            <!-- movie card grid -->
            <section aria-label="Movies">
                <div class="row row-cols-2 row-cols-sm-3 row-cols-lg-5 row-cols-xxl-6 g-3" id="movie-grid">
                    {{ range .movies }}
                        {{ template "card" . }}
                    {{ end }}
                </div>
            </section>
            <!-- /movie card grid -->

        </div><!-- /.container-fluid -->
    </div><!-- /.page-content -->

    <footer class="footer">
        <div class="container-fluid">
            <!-- 可放分页信息/统计 -->
        </div>
    </footer>
{{ end }}
