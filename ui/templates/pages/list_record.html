{{ define "page.list_record" }}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{{ if .Title }}{{ .Title }} - {{ end }}Rudy-GC</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- 核心样式 -->
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/icons.min.css" rel="stylesheet">
    <link href="/static/css/app.min.css" rel="stylesheet">

    <!-- DataTables -->
    <link href="/static/css/dataTables.bootstrap4.min.css" rel="stylesheet">
    <link href="/static/css/buttons.bootstrap4.min.css" rel="stylesheet">
    <link href="/static/css/responsive.bootstrap4.min.css" rel="stylesheet">

    <!-- 自定义样式（如有使用到） -->
    <link href="/static/css/custom/a_moviecardlist.css" rel="stylesheet">
    <link href="/static/css/custom/a_moviedetail.css" rel="stylesheet">
</head>

<body data-sidebar="dark">
{{ template "menu" . }}

<main class="main-content">
    <div class="page-content">
        <div class="container-fluid">

            <!-- 标题 + 筛选 -->
            <div class="d-flex align-items-center justify-content-between mb-3">
                <h4 class="mb-0">Records</h4>

                <form class="form-inline" method="get" action="/records">
                    <div class="input-group">
                        <!-- 类型筛选 -->
                        <select class="form-select" name="type" style="min-width: 200px;">
                            <option value="">All Types</option>
                            {{ range .TypeOptions }}
                            <option value="{{ . }}" {{ if eq $.Query.Type . }}selected{{ end }}>{{ . }}</option>
                            {{ end }}
                        </select>

                        <!-- 数量限制 -->
                        <input type="number" class="form-control" name="limit" placeholder="Limit"
                               value="{{ .Query.Limit }}">

                        <button class="btn btn-primary" type="submit">Filter</button>
                    </div>
                </form>
            </div>

            <!-- 表格 -->
            <div class="card">
                <div class="card-body table-responsive">
                    <table id="recordsTable" class="table table-sm table-hover align-middle">
                        <thead class="table-light">
                        <tr>
                            <th>Date</th>
                            <th>Type</th>
                            <th>Detail #</th>
                            <th>Duration (min)</th>
                        </tr>
                        </thead>
                        <tbody>
                        {{ range .Records }}
                        <tr>
                            <td>{{ .Date }}</td>
                            <td>{{ .Type }}</td>
                            <td>{{ .DetailNumber }}</td>
                            <td>{{ .DurationMin }}</td>
                        </tr>
                        {{ end }}
                        </tbody>
                    </table>
                </div>
            </div>

        </div><!-- /.container-fluid -->
    </div><!-- /.page-content -->
</main>

<!-- 你示例里引用的自定义脚本（保持一致，确保菜单等正常） -->
<script src="/static/customer/movie_downloadlater.js"></script>

<!-- 基础 JS -->
<script src="/static/js/jquery.min.js"></script>
<script src="/static/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/metisMenu.min.js"></script>
<script src="/static/js/simplebar.min.js"></script>
<script src="/static/js/waves.min.js"></script>
<script src="/static/js/jquery.sparkline.min.js"></script>

<!-- DataTables 全套 -->
<script src="/static/js/jquery.dataTables.min.js"></script>
<script src="/static/js/dataTables.bootstrap4.min.js"></script>
<script src="/static/js/dataTables.responsive.min.js"></script>
<script src="/static/js/responsive.bootstrap4.min.js"></script>
<script src="/static/js/dataTables.buttons.min.js"></script>
<script src="/static/js/buttons.bootstrap4.min.js"></script>
<script src="/static/js/jszip.min.js"></script>
<script src="/static/js/buttons.html5.min.js"></script>
<script src="/static/js/buttons.print.min.js"></script>
<script src="/static/js/buttons.colVis.min.js"></script>
<script src="/static/js/datatables.init.js"></script>

<!-- 其他插件 -->
<script src="/static/js/dropzone.min.js"></script>

<!-- 项目脚本（保持与示例一致） -->
<script src="/static/js/dashboard.init.js"></script>
<script src="/static/js/app.js"></script>
<script src="/static/customer/open_finder.js"></script>

<script>
    $(function () {
        $('#recordsTable').DataTable({
            pageLength: 25,
            order: [[0, 'desc']] // 按 Date 倒序
        });
    });
</script>
</body>
</html>
{{ end }}
