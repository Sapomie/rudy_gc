{{ define "page.admin_triggers" }}
    <!doctype html>
    <html lang="zh-CN">
    <head>
        <meta charset="utf-8">
        <title>{{ if .Title }}{{ .Title }} - {{ end }}Rudy-GC</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="/static/css/bootstrap.min.css" rel="stylesheet">
        <link href="/static/css/icons.min.css" rel="stylesheet">
        <link href="/static/css/app.min.css" rel="stylesheet">
    </head>

    <body data-sidebar="dark">
    {{ template "menu" . }}

    <main class="main-content">
        <div class="page-content">
            <div class="container-fluid">

                <div class="d-flex align-items-center justify-content-between mb-3">
                    <h4 class="mb-0">Trigger 控制台</h4>
                </div>

                <div class="row">
                    <div class="col-xl-6">
                        <div class="card">
                            <div class="card-body">
                                <h4 class="card-title">触发 / 控制</h4>
                                <p class="card-title-desc">
                                    点击按钮触发后端任务流程，或停止当前正在运行的流程。
                                </p>

                                <div class="button-items">
                                    <button id="btnDailyBest" type="button" class="btn btn-primary waves-effect waves-light">
                                        触发 DailyBest
                                    </button>

                                    <button id="btnSeeds" type="button" class="btn btn-success waves-effect waves-light">
                                        触发 Seeds
                                    </button>

                                </div>

                                <hr class="my-4">

                                <div>
                                    <h5 class="card-title mb-2">状态</h5>
                                    <div id="statusArea" class="small text-muted">尚未触发。</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- JS -->
    <script src="/static/js/jquery.min.js"></script>
    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/metisMenu.min.js"></script>
    <script src="/static/js/simplebar.min.js"></script>
    <script src="/static/js/waves.min.js"></script>
    <script src="/static/js/app.js"></script>

    <script>
        (function () {
            const status = document.getElementById('statusArea');

            function post(url, body) {
                return fetch(url, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: body ? JSON.stringify(body) : null
                });
            }

            function ok(msg) {
                status.classList.remove('text-danger');
                status.classList.add('text-success');
                status.textContent = msg;
            }

            function err(msg) {
                status.classList.remove('text-success');
                status.classList.add('text-danger');
                status.textContent = msg;
            }

            // === 触发：DailyBest ===
            document.getElementById('btnDailyBest').onclick = function () {
                ok('触发中…');
                post('/api/triggers/daily-best')
                    .then(r => r.ok ? ok('已触发 DailyBest') : err('触发失败（' + r.status + '）'))
                    .catch(e => err('触发异常：' + e));
            };

            // === 触发：Seeds ===
            document.getElementById('btnSeeds').onclick = function () {
                ok('触发中…');
                post('/api/triggers/seeds')
                    .then(r => r.ok ? ok('已触发 Seeds') : err('触发失败（' + r.status + '）'))
                    .catch(e => err('触发异常：' + e));
            };
            
        })();
    </script>

    </body>
    </html>
{{ end }}
