{{ define "page.admin_triggers" }}
    <!doctype html>
    <html lang="zh-CN">
    <head>
        <meta charset="utf-8">
        <title>{{ if .Title }}{{ .Title }} - {{ end }}Rudy-GC</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="/static/css/bootstrap.min.css" rel="stylesheet">
        <link href="/static/css/icons.min.css" rel="stylesheet">
        <link href="/static/css/app.min.css" rel="stylesheet">
    </head>

    <body data-sidebar="dark">
    {{ template "menu" . }}

    <main class="main-content">
        <div class="page-content">
            <div class="container-fluid">

                <div class="d-flex align-items-center justify-content-between mb-3">
                    <h4 class="mb-0">Trigger 控制台</h4>
                </div>

                <div class="row g-4">
                    <!-- 左：爬虫触发 -->
                    <div class="col-xl-6">
                        <div class="card">
                            <div class="card-body">
                                <h4 class="card-title">爬虫任务</h4>
                                <p class="card-title-desc">点击按钮触发相应的爬虫流程。</p>

                                <div class="button-items">
                                    <button id="btnDailyBest" type="button"
                                            class="btn btn-primary waves-effect waves-light me-2 mb-2">
                                        触发 DailyBest
                                    </button>

                                    <button id="btnSeeds" type="button"
                                            class="btn btn-success waves-effect waves-light me-2 mb-2">
                                        触发 Seeds
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 右：影片触发 -->
                    <div class="col-xl-6">
                        <div class="card">
                            <div class="card-body">
                                <h4 class="card-title">影片任务</h4>
                                <p class="card-title-desc">点击按钮执行影片相关任务（重命名或处理）。</p>

                                <div class="button-items">
                                    <button id="btnFilmRename" type="button"
                                            class="btn btn-info waves-effect waves-light me-2 mb-2">
                                        触发 影片重命名
                                    </button>

                                    <button id="btnFilmProcess" type="button"
                                            class="btn btn-warning waves-effect waves-light me-2 mb-2">
                                        触发 影片处理
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- JS -->
    <script src="/static/js/jquery.min.js"></script>
    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/metisMenu.min.js"></script>
    <script src="/static/js/simplebar.min.js"></script>
    <script src="/static/js/waves.min.js"></script>
    <script src="/static/js/app.js"></script>

    <script>
        (function () {
            function post(url, body) {
                return fetch(url, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: body ? JSON.stringify(body) : null
                });
            }

            // === 爬虫：DailyBest ===
            document.getElementById('btnDailyBest').onclick = function () {
                post('/api/triggers/daily-best');
            };

            // === 爬虫：Seeds ===
            document.getElementById('btnSeeds').onclick = function () {
                post('/api/triggers/seeds');
            };

            // === 影片：RenameFilm ===
            document.getElementById('btnFilmRename').onclick = function () {
                post('/api/triggers/film/rename');
            };

            // === 影片：ProcessFilm ===
            document.getElementById('btnFilmProcess').onclick = function () {
                post('/api/triggers/film/process');
            };
        })();
    </script>

    </body>
    </html>
{{ end }}
