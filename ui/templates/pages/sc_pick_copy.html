{{ define "page.sc_pick_copy" }}
    <!doctype html>
    <html lang="zh-CN">
    <head>
        <meta charset="utf-8">
        <title>{{ if .Title }}{{ .Title }} - {{ end }}Rudy-GC</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="/static/css/bootstrap.min.css" rel="stylesheet">
        <link href="/static/css/icons.min.css" rel="stylesheet">
        <link href="/static/css/app.min.css" rel="stylesheet">
        <link href="/static/css/custom/a_moviecardlist.css" rel="stylesheet">
        <style>
            #msgArea {
                position: fixed;
                bottom: 20px;
                right: 20px;
                z-index: 2000;
                display: none;
            }
        </style>
    </head>

    <body data-sidebar="dark">
    {{ template "menu" . }}

    <main class="main-content">
        <div class="page-content">
            <div class="container-fluid">
                <div class="d-flex align-items-center justify-content-between mb-3">
                    <h4 class="mb-0">SC Pick Copy</h4>
                </div>

                <div class="card">
                    <div class="card-body">
                        <p class="text-muted mb-2">填写条件组，点击执行后按权重抽取并复制影片。</p>
                        <p class="text-muted small mb-3">固定值：Owned=3，Page=1，PageSize=100000。</p>

                        <form id="formPickCopy" class="needs-validation" novalidate>
                            <div class="row g-3 align-items-center mb-3">
                                <div class="col-auto">
                                    <label for="pickCount" class="col-form-label">抽取数量：</label>
                                </div>
                                <div class="col-auto">
                                    <input type="number" min="1" class="form-control" id="pickCount" value="8" required>
                                    <div class="invalid-tooltip">请输入大于 0 的数字</div>
                                </div>
                                <div class="col-auto">
                                    <button type="button" id="btnAddGroup" class="btn btn-outline-secondary">
                                        添加一组条件
                                    </button>
                                </div>
                            </div>

                            <div id="pickGroups"></div>

                            <div class="mt-3">
                                <button type="submit" class="btn btn-primary">执行 Pick + Copy</button>
                                <button type="button" class="btn btn-outline-primary ms-2"
                                        id="btnPickOnly">仅 Pick 不 Copy</button>
                            </div>
                        </form>
                    </div>
                </div>
     
                <div class="card mt-3" id="pickedCard" style="display: none;">
                    <div class="card-body">
                        <div class="d-flex align-items-center justify-content-between mb-3">
                            <h5 class="mb-0">抽取结果</h5>
                            <span class="text-muted small" id="pickedCount"></span>
                        </div>
                        <div class="row row-cols-2 row-cols-sm-3 row-cols-lg-5 g-3 picked-grid-8"
                             id="pickedGrid"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <template id="pickGroupTpl">
        <div class="card border mb-3 pick-group">
            <div class="card-body">
                <div class="d-flex align-items-center justify-content-between mb-2">
                    <h6 class="mb-0">条件组</h6>
                    <button type="button" class="btn btn-sm btn-outline-danger btn-remove-group">移除</button>
                </div>

                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">权重</label>
                        <input type="number" min="1" class="form-control" data-role="weight" value="12" required>
                        <div class="invalid-tooltip">请输入权重</div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Dir4 (d4)</label>
                        <input type="text" class="form-control" data-req-field="Dir4">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">关键字 (wd)</label>
                        <input type="text" class="form-control" data-req-field="Word" placeholder="可为空">
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <button type="button" class="btn btn-sm btn-outline-secondary w-100" data-role="adv-toggle">
                            高级参数
                        </button>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">放映日期起 (rs)</label>
                        <input type="text" class="form-control" data-req-field="ReleasingDateStart"
                               placeholder="YYYY-MM-DD" inputmode="numeric" maxlength="10"
                               pattern="[0-9]{4}-[0-9]{2}-[0-9]{2}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">放映日期止 (re)</label>
                        <input type="text" class="form-control" data-req-field="ReleasingDateEnd"
                               placeholder="YYYY-MM-DD" inputmode="numeric" maxlength="10"
                               pattern="[0-9]{4}-[0-9]{2}-[0-9]{2}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">下载日期起 (bs)</label>
                        <input type="text" class="form-control" data-req-field="FilmBirthTimeStart"
                               placeholder="YYYY-MM-DD" inputmode="numeric" maxlength="10"
                               pattern="[0-9]{4}-[0-9]{2}-[0-9]{2}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">下载日期止 (be)</label>
                        <input type="text" class="form-control" data-req-field="FilmBirthTimeEnd"
                               placeholder="YYYY-MM-DD" inputmode="numeric" maxlength="10"
                               pattern="[0-9]{4}-[0-9]{2}-[0-9]{2}">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">ScTimes 最小 (scmin)</label>
                        <input type="number" class="form-control" data-req-field="ScTimesMin" data-type="int" placeholder="0">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">ScTimes 最大 (scmax)</label>
                        <input type="number" class="form-control" data-req-field="ScTimesMax" data-type="int-opt"
                               placeholder="可为空" value="0">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">ComeTimes 最小 (comin)</label>
                        <input type="number" class="form-control" data-req-field="ComeTimesMin" data-type="int" placeholder="0">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">ComeTimes 最大 (comax)</label>
                        <input type="number" class="form-control" data-req-field="ComeTimesMax" data-type="int-opt" placeholder="可为空">
                    </div>

                    <div class="col-12 collapse" data-role="adv-panel">
                        <div class="row g-3 mt-1">
                            <div class="col-md-4">
                                <label class="form-label">演员 (cn)</label>
                                <input type="text" class="form-control" data-req-field="CastNames">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">类型 (gn)</label>
                                <input type="text" class="form-control" data-req-field="GenreNames">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">导演 (dn)</label>
                                <input type="text" class="form-control" data-req-field="DirectorName">
                            </div>

                            <div class="col-md-4">
                                <label class="form-label">前缀 (pn)</label>
                                <input type="text" class="form-control" data-req-field="PrefixName">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">制作商 (mn)</label>
                                <input type="text" class="form-control" data-req-field="MakerName">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">厂牌 (ln)</label>
                                <input type="text" class="form-control" data-req-field="LabelName">
                            </div>

                            <div class="col-md-3">
                                <label class="form-label">评分最小 (smin)</label>
                                <input type="number" step="0.1" class="form-control" data-req-field="ScoreMin" data-type="float">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">评分最大 (smax)</label>
                                <input type="number" step="0.1" class="form-control" data-req-field="ScoreMax" data-type="float-opt">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">观看最小 (vwmin)</label>
                                <input type="number" class="form-control" data-req-field="ViewWatchedMin" data-type="int">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">观看最大 (vwmax)</label>
                                <input type="number" class="form-control" data-req-field="ViewWatchedMax" data-type="int-opt">
                            </div>

                            <div class="col-md-3">
                                <label class="form-label">最后评分起 (lsctmin)</label>
                                <input type="text" class="form-control" data-req-field="LastScTimeMin"
                                       placeholder="YYYY-MM-DD" inputmode="numeric" maxlength="10"
                                       pattern="[0-9]{4}-[0-9]{2}-[0-9]{2}">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">最后评分止 (lsctmax)</label>
                                <input type="text" class="form-control" data-req-field="LastScTimeMax"
                                       placeholder="YYYY-MM-DD" inputmode="numeric" maxlength="10"
                                       pattern="[0-9]{4}-[0-9]{2}-[0-9]{2}">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Dir1 (d1)</label>
                                <input type="text" class="form-control" data-req-field="Dir1">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Dir2 (d2)</label>
                                <input type="text" class="form-control" data-req-field="Dir2">
                            </div>

                            <div class="col-md-3">
                                <label class="form-label">Dir3 (d3)</label>
                                <input type="text" class="form-control" data-req-field="Dir3">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">排序 (od)</label>
                                <input type="text" class="form-control" data-req-field="OrderBy" placeholder="sc/lsct/bt...">
                            </div>
                            <div class="col-md-3 d-none d-md-block"></div>
                            <div class="col-md-3 d-none d-md-block"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <div id="msgArea" class="alert alert-success fade show small py-2 px-3"></div>

    <script src="/static/js/jquery.min.js"></script>
    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/metisMenu.min.js"></script>
    <script src="/static/js/simplebar.min.js"></script>
    <script src="/static/js/waves.min.js"></script>
    <script src="/static/js/jquery.sparkline.min.js"></script>
    <script src="/static/js/dataTables.buttons.min.js"></script>
    <script src="/static/js/buttons.bootstrap4.min.js"></script>
    <script src="/static/js/jszip.min.js"></script>
    <script src="/static/js/buttons.html5.min.js"></script>
    <script src="/static/js/buttons.print.min.js"></script>
    <script src="/static/js/buttons.colVis.min.js"></script>
    <script src="/static/js/dashboard.init.js"></script>
    <script src="/static/customer/sc_pick_copy.js"></script>
    <script src="/static/js/app.js"></script>
    </body>
    </html>
{{ end }}
