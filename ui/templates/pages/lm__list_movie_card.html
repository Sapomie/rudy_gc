{{ define "page.list_movie_card" }}
    <!doctype html>
    <html lang="en">
    <head>
        <meta charset="utf-8">
        <title>{{ if .Title }}{{ .Title }} - {{ end }}Rudy-GC</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="/static/css/bootstrap.min.css" rel="stylesheet">
        <link href="/static/css/icons.min.css" rel="stylesheet">
        <link href="/static/css/app.min.css" rel="stylesheet">
        <link href="/static/css/dataTables.bootstrap4.min.css" rel="stylesheet">
        <link href="/static/css/buttons.bootstrap4.min.css" rel="stylesheet">
        <link href="/static/css/responsive.bootstrap4.min.css" rel="stylesheet">
        <link href="/static/css/custom/a_moviecardlist.css" rel="stylesheet">
    </head>

    <body data-sidebar="dark">
    {{ template "menu" . }}

    <main class="main-content">
        <div class="page-content">
            <div class="container-fluid">
                <!-- Sticky 工具栏 -->
                <div class="position-sticky pb-2 pt-2 mb-3 border-bottom"
                     style="top:0; z-index:1030; background:rgba(255,255,255,.9); backdrop-filter: blur(6px);">
                    <div class="container-fluid px-0">

                        <!-- 第一行：排序栏 -->
                        <div class="d-flex flex-wrap justify-content-start align-items-center mb-2">
                            {{ template "sort_bar" . }}
                        </div>

                        <!-- 第二行：筛选 + 分页 -->
                        <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-2">
                            <div class="d-flex flex-wrap align-items-center toolbar-gap">
                                {{ template "owned_filter" . }}
                            </div>
                            <div class="d-flex flex-wrap align-items-center ms-md-3">
                                {{ template "pagination" . }}
                            </div>
                        </div>

                    </div>
                </div>
                <!-- /Sticky 工具栏 -->

                <!-- movie card grid -->
                <section aria-label="Movies">
                    <div class="row row-cols-2 row-cols-sm-3 row-cols-lg-5 row-cols-xxl-6 g-3" id="movie-grid">
                        {{ range .movies }}
                            {{ template "card" . }}
                        {{ end }}
                    </div>
                </section>
                <!-- /movie card grid -->

            </div>
        </div>
    </main>

    <!-- JS -->
    <script src="/static/js/jquery.min.js"></script>
    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/metisMenu.min.js"></script>
    <script src="/static/js/simplebar.min.js"></script>
    <script src="/static/js/waves.min.js"></script>
    <script src="/static/js/jquery.sparkline.min.js"></script>
    <script src="/static/js/dataTables.buttons.min.js"></script>
    <script src="/static/js/buttons.bootstrap4.min.js"></script>
    <script src="/static/js/jszip.min.js"></script>
    <script src="/static/js/buttons.html5.min.js"></script>
    <script src="/static/js/buttons.print.min.js"></script>
    <script src="/static/js/buttons.colVis.min.js"></script>
    <script src="/static/js/dashboard.init.js"></script>
    <script src="/static/js/app.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            var list = [].slice.call(document.querySelectorAll('[title]'));
            list.forEach(function (el) {
                if (el.getAttribute('data-bs-toggle') !== 'tooltip') {
                    el.setAttribute('data-bs-toggle', 'tooltip');
                    if (window.bootstrap && bootstrap.Tooltip) {
                        new bootstrap.Tooltip(el, {boundary: document.body, container: 'body'});
                    }
                }
            });
        });
    </script>
    </body>
    </html>
{{ end }}
